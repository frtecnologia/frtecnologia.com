<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR Tecnología</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: #000000;
            position: relative; /* Necesario para la marca de agua */
            overflow-x: hidden;
        }

        /* MARCA DE AGUA */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 8rem;
            color: rgba(0, 0, 0, 0.03); /* Casi invisible */
            font-weight: 800;
            z-index: -1; /* Va detrás de todo */
            pointer-events: none;
            white-space: nowrap;
            user-select: none;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .logo { max-width: 150px; margin-bottom: 10px; }
        h1 { font-weight: 800; font-size: 2.5rem; margin: 0; text-transform: uppercase; }
        .slogan { font-size: 1.1rem; margin-top: 5px; }
        .services { color: #7a7a7a; font-size: 0.95rem; margin-top: 15px; }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 40px;
            background-color: #238636;
            color: #e0e0e0;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        /* PIE DE PÁGINA (RRSS) */
        footer {
            padding: 2rem;
            background-color: #f8f9fa;
            border-top: 1px solid #eeeeee;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .social-item {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #444;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .social-item i { font-size: 1.5rem; color: #000; }
        .social-item:hover { color: #238636; }
    </style>
</head>
<body>

    <!-- Marca de agua -->
    <div class="watermark">FR TECNOLOGÍA</div>

    <div class="container">
        <img src="logo3.png" alt="Logo FR Tecnología" class="logo">
        <h1>FRTECNOLOGIA</h1>
        <p class="slogan">Soluciones tecnológicas para tu hogar o negocio</p>
        <p class="services">Redes | Cámaras | Instalaciones | Servicio Técnico especializado PC</p>
        <a href="https://wa.me/584147388779" class="btn">Contactanos</a>
    </div>

    <footer>
        <a href="https://wa.me/584147388779" class="social-item">
            <i class="fa-brands fa-whatsapp"></i> +58 414-7388779
        </a>
        <a href="https://instagram.com/frtecnologia.sc" class="social-item">
            <i class="fa-brands fa-instagram"></i> @frtecnologia.sc
        </a>
        <a href="https://t.me/frtecnologia_sc" class="social-item">
            <i class="fa-brands fa-telegram"></i> @frtecnologia_sc
        </a>
    </footer>

</body>
</html>
