<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR Tecnología</title>
    <!-- Importamos Montserrat desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <!-- Iconos para Redes Sociales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #ffffff;
            /* Añadimos el patrón */
            background-image: url('pattern.png'); 
            background-repeat: repeat; /* Esto crea el efecto mosaico */
            background-size: 250px; /* Ajusta este número para que el logo sea más grande o pequeño */
            background-attachment: fixed; /* Esto hace que el fondo se quede quieto al bajar con el scroll */
            
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        @keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
        /* Contenedor Principal */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            background-color: rgba(255, 255, 255, 0.85); /* Blanco con 85% de opacidad */
            backdrop-filter: blur(5px); /* Efecto de desenfoque muy moderno */
            border-radius: 20px; /* Bordes suaves */
            max-width: 600px; /* Para que no ocupe todo el ancho */
            margin: auto; /* Centrado */
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); /* Sombra muy sutil */
            animation: fadeInUp 1.5s ease-out;
        }
        
        .logo {
            /* Ajuste para el nuevo logo3.png */
            max-width: 180px; 
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-weight: 800;
            font-size: 2.8rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .slogan {
            font-size: 1.1rem;
            margin-top: 5px;
            font-weight: 400;
        }

        .services {
            color: #7a7a7a;
            font-size: 0.95rem;
            margin-top: 15px;
            font-weight: 500;
        }

        /* Botón NEGRO */
        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 45px;
            background-color: #000000; /* Color Negro */
            color: #ffffff; /* Texto Blanco para contraste */
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #222; /* Un gris muy oscuro */
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            transform: scale(1.05);
            letter-spacing: 2px;    /* El texto se expande un poco */
            transition: all 0.3s ease;
        }

        /* Pie de Página (RRSS) */
        footer {
            padding: 2.5rem;
            background-color: #ffffff;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .social-item {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #444;
            font-size: 0.9rem;
            transition: color 0.3s;
            font-weight: 500;
        }

        .social-item i {
            font-size: 1.6rem;
            color: #000;
        }

        .social-item:hover {
            color: #000;
            text-decoration: underline;
        }

        /* Ajuste para móviles */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            footer { gap: 20px; flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Referencia al nuevo logo3.png -->
        <img src="logo3.png" alt="Logo FR Tecnología" class="logo">
        
        <h1>FR TECNOLOGIA</h1>
        <p class="slogan">Soluciones tecnológicas para tu hogar o negocio</p>
        <p class="services">Tecnología | Redes | Cámaras | CCTV | PC | Servicio Técnico especializado.</p>
        
        <!-- Botón Negro de Contacto -->
        <a href="https://wa.me/584147388779" class="btn">Contactanos</a>
    </div>

    <footer>
        <a href="https://wa.me/584147388779" class="social-item" target="_blank">
            <i class="fa-brands fa-whatsapp"></i> +58 414-7388779
        </a>
        <a href="https://instagram.com/frtecnologia.sc" class="social-item" target="_blank">
            <i class="fa-brands fa-instagram"></i> @frtecnologia.sc
        </a>
        <a href="https://t.me/frtecnologia_sc" class="social-item" target="_blank">
            <i class="fa-brands fa-telegram"></i> @frtecnologia_sc
        </a>
    </footer>

</body>
</html>
