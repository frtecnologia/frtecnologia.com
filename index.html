<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR Tecnología | Táchira</title>
    <style>
        /* La base: Definimos colores y tipografía */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117; /* Fondo oscuro tipo GitHub */
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        /* Creamos un contenedor elegante */
        .container {
            border: 1px solid #30363d;
            padding: 3rem;
            border-radius: 12px;
            background: linear-gradient(145deg, #161b22, #0d1117);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            color: #58a6ff; /* Azul tecnológico */
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        p {
            color: #8b949e;
            font-size: 1.1rem;
        }

        /* Un botón con efecto visual */
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #238636; /* Verde éxito */
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #2ea043;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FR Tecnología</h1>
        <p>Soluciones tecnólogicas para tu hogar o negocio.</p>
        <p><i>Este sitio ha sido desplegado exitosamente.</i></p>
        <a href="#" class="btn">Contactanos</a>
    </div>

</body>
</html>
