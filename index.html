<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR Tecnología</title>
    <!-- Importamos Montserrat desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Montserrat:wght@400&display=swap" rel="stylesheet">
    <style>
        body {
            /* 1. Fondo de la pagina BLANCO */
            background-color: #ffffff;
            font-family: 'Montserrat', 'Bahnschrift', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #000000;
        }

        .container {
            /* Eliminamos el borde oscuro para un look más limpio sobre blanco */
            text-align: center;
            max-width: 500px;
            padding: 2rem;
        }

        .logo {
            width: 140px;
            height: auto;
            margin-bottom: 10px;
            /* Filtro opcional: si el logo es muy oscuro, esto le da nitidez */
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.1));
        }

        h1 {
            /* 2 y 3. Título Montserrat/Bahnschrift Negrita Negro */
            font-family: 'Montserrat', 'Bahnschrift', sans-serif;
            font-weight: 800; 
            font-size: 2.5rem;
            color: #000000;
            margin: 0;
            text-transform: uppercase;
        }

        .slogan {
            /* 4. Eslogan Montserrat/Bahnschrift Negro */
            font-family: 'Montserrat', sans-serif;
            color: #000000;
            font-size: 1.1rem;
            margin-top: 5px;
            font-weight: 400;
        }

        .services {
            /* 5. Color texto servicios: Plateado */
            color: #8e8e8e; /* Tono plateado/gris metálico */
            font-size: 0.95rem;
            margin-top: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 40px;
            background-color: #238636;
            /* 6. Color texto dentro del botón: Plateado */
            color: #e0e0e0; 
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-family: 'Montserrat', sans-serif;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:hover {
            background-color: #1e722e;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="Logo FR Tecnología" class="logo">
        
        <h1>FRTECNOLOGIA</h1>
        <p class="slogan">Soluciones tecnológicas para tu hogar o negocio</p>
        <p class="services">Redes | Cámaras | Instalaciones | Servicio Técnico especializado PC</p>
        
        <a href="https://wa.me/584147388779" class="btn">Contactanos</a>
    </div>

</body>
</html>
